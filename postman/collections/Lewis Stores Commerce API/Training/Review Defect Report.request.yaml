$kind: http-request
method: PUT
url: '{{base_url}}/api/Training/defect-reports/{{report_id}}/review'
order: 7000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: report_id
    value: '1'
body:
  type: json
  content: |-
    {
      "status": "Reviewed",
      "instructorFeedback": "Good reproduction steps.",
      "score": 90
    }
