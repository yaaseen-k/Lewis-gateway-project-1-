$kind: http-request
url: "{{base_url}}/api/Pricing/validate"
method: POST
body:
  type: json
  content: "{\r

    \  \"unitPrice\": 250.00,\r

    \  \"quantity\": 4,\r

    \  \"vatRate\": 0.15,\r

    \  \"allowZeroValue\": false\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Subtotal equals unitPrice * quantity exactly\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    const expectedSubtotal = 250.00 * 4; // 1000.00\r

      \    pm.expect(jsonData.subtotal).to.be.closeTo(expectedSubtotal, 0.0001);\r

      });\r

      \r

      pm.test(\"VAT amount equals subtotal * vatRate exactly\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    const expectedVat = jsonData.subtotal * jsonData.vatRate; // 150.00\r

      \    pm.expect(jsonData.vatAmount).to.be.closeTo(expectedVat, 0.0001);\r

      });\r

      \r

      pm.test(\"Total equals subtotal + vatAmount exactly\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    const expectedTotal = jsonData.subtotal + jsonData.vatAmount; // 1150.00\r

      \    pm.expect(jsonData.total).to.be.closeTo(expectedTotal, 0.0001);\r

      });\r

      \r

      pm.test(\"Full calculation chain matches expected final figures\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.subtotal).to.be.closeTo(1000.00, 0.0001);\r

      \    pm.expect(jsonData.vatAmount).to.be.closeTo(150.00, 0.0001);\r

      \    pm.expect(jsonData.total).to.be.closeTo(1150.00, 0.0001);\r

      });\r

      \r

      pm.test(\"vatRate returned matches vatRate submitted\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.vatRate).to.eql(0.15);\r

      });"
    language: text/javascript
examples: .resources/API-PRC-019 - Final Price Calculation.resources/examples
order: 1787044176891
