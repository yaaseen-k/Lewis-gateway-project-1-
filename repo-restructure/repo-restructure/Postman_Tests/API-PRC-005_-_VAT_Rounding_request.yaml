$kind: http-request
url: "{{base_url}}/api/Pricing/validate"
method: POST
body:
  type: json
  content: "{\r

    \  \"unitPrice\": 33.33,\r

    \  \"quantity\": 3,\r

    \  \"vatRate\": 15,\r

    \  \"allowZeroValue\": false\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Monetary values in response have at most 2 decimal places\", function () {\r

      \    const body = pm.response.text();\r

      \    const decimals = (body.match(/\\d+\\.(\\d+)/g) || []).map(function (m) {\r

      \        return m.split(\".\")[1].length;\r

      \    });\r

      \    decimals.forEach(function (d) {\r

      \        pm.expect(d, `found a value with ${d} decimal places in: ${body}`).to.be.at.most(2);\r

      \    });\r

      });\r

      \r

      pm.test(\"No obvious floating-point artifacts in response\", function () {\r

      \    const body = pm.response.text();\r

      \    pm.expect(body).to.not.match(/\\.\\d{3,}/); // e.g. catches \"34.499999999998\"\r

      });"
    language: text/javascript
examples: .resources/API-PRC-005 - VAT Rounding.resources/examples
order: 4148674786340846
